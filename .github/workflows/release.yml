name: release

# Push a tag such as v0.7.0 (a pre-release if it contains a dash, e.g. v0.8.0-rc.1).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: The tag must match the version in Directory.Build.props
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Directory.Build.props version v$version" >&2
            exit 1
          fi
      - name: Build and test
        run: |
          dotnet build --configuration Release
          dotnet test --configuration Release --no-build

  publish:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64, os: windows-latest, flavour: self-contained }
          - { rid: win-x64, os: windows-latest, flavour: framework-dependent }
          - { rid: linux-x64, os: ubuntu-latest, flavour: self-contained }
          - { rid: linux-x64, os: ubuntu-latest, flavour: framework-dependent }
          - { rid: osx-arm64, os: macos-latest, flavour: self-contained }
          - { rid: osx-arm64, os: macos-latest, flavour: framework-dependent }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish a single-file build
        shell: bash
        run: |
          # Self-contained: no .NET needed, compressed (about 45 MB). Framework-dependent: needs the .NET 10 runtime (about 26 MB; compression is not allowed there).
          if [ "${{ matrix.flavour }}" = "self-contained" ]; then
            mode="--self-contained -p:EnableCompressionInSingleFile=true"
          else
            mode="--no-self-contained"
          fi
          dotnet publish src/Clims.Tui -c Release -r ${{ matrix.rid }} $mode -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - name: Package
        shell: bash
        run: |
          name="clims-${GITHUB_REF_NAME}-${{ matrix.rid }}"
          if [ "${{ matrix.flavour }}" = "framework-dependent" ]; then name="$name-framework-dependent"; fi
          mkdir "$name"
          cp publish/Clims.Tui* "$name/" && rm -f "$name"/*.pdb
          cp LICENSE README.md CHANGELOG.md "$name/"
          if [ "${{ matrix.rid }}" = "win-x64" ]; then
            7z a "$name.zip" "$name" > /dev/null
          else
            tar -czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.rid }}-${{ matrix.flavour }}
          path: |
            clims-*.zip
            clims-*.tar.gz

  release:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: dist
      - name: Checksums
        run: cd dist && sha256sum clims-* > SHA256SUMS
      - name: Notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \[" v "\]" {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "cLiMS ${GITHUB_REF_NAME#v}" --notes-file notes.md $flags
